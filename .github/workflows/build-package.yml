name: Check and Package Skill
on:
  workflow_dispatch:
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check Python scripts
        run: python -m py_compile skills/ai-logo-maker/scripts/*.py
      - name: Check JSON files
        run: |
          find . -name "*.json" -not -path "./.git/*" | while read f; do python -m json.tool "$f" > /dev/null || exit 1; done
      - name: Make ZIP
        run: |
          mkdir out
          zip -qr out/ai-logo-maker-skill-Zohir.zip . -x ".git/*" ".github/*" "out/*"
      - uses: actions/upload-artifact@v4
        with:
          name: ai-logo-maker-skill-Zohir
          path: out/ai-logo-maker-skill-Zohir.zip
